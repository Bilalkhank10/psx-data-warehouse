<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b6470"/>
    </marker>
    <style>
      .box  { fill:#ffffff; stroke:#cdd5dd; stroke-width:1.5; rx:10; }
      .tool { fill:#f4f8f5; stroke:#0e7c3a; stroke-width:1.5; }
      .title{ font-size:15px; font-weight:700; fill:#1a1f24; }
      .sub  { font-size:11.5px; fill:#5b6470; }
      .lane { font-size:11px; font-weight:700; fill:#0e7c3a; letter-spacing:2px; }
      .ln   { stroke:#5b6470; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1120" height="360" fill="#fbfcfd" rx="14"/>

  <text x="40" y="40" class="lane">EXTRACT</text>
  <rect x="40" y="60" width="240" height="70" class="box" rx="10"/>
  <text x="58" y="88" class="title">Yahoo Finance API</text>
  <text x="58" y="110" class="sub">20 PSX tickers · USD/PKR · ^KSE</text>
  <rect x="40" y="150" width="240" height="70" class="box" rx="10"/>
  <text x="58" y="178" class="title">dbt seeds</text>
  <text x="58" y="200" class="sub">stocks.csv · sbp_policy_rates.csv</text>
  <rect x="40" y="240" width="240" height="70" class="box" rx="10"/>
  <text x="58" y="268" class="title">Synthetic fallback</text>
  <text x="58" y="290" class="sub">deterministic generator (CI-safe)</text>

  <text x="360" y="40" class="lane">LOAD</text>
  <rect x="360" y="120" width="170" height="110" class="tool" rx="10"/>
  <text x="378" y="150" class="title">Python loader</text>
  <text x="378" y="172" class="sub">fault-tolerant</text>
  <text x="378" y="190" class="sub">parquet snapshots</text>
  <text x="378" y="208" class="sub">idempotent refresh</text>

  <text x="610" y="40" class="lane">TRANSFORM · dbt-duckdb</text>
  <rect x="610" y="60" width="200" height="76" class="box" rx="10"/>
  <text x="626" y="86" class="title">staging (views)</text>
  <text x="626" y="106" class="sub">typed · surrogate keys</text>
  <text x="626" y="122" class="sub">freshness monitored</text>
  <rect x="610" y="234" width="200" height="76" class="box" rx="10"/>
  <text x="626" y="260" class="title">snapshots</text>
  <text x="626" y="280" class="sub">SCD2 via dbt_valid_from/to</text>
  <rect x="830" y="140" width="210" height="110" class="tool" rx="10"/>
  <text x="846" y="168" class="title">marts (tables)</text>
  <text x="846" y="188" class="sub">fct_daily_prices</text>
  <text x="846" y="206" class="sub">fct_market_summary</text>
  <text x="846" y="224" class="sub">agg_sector_performance</text>

  <text x="40" y="345" class="lane">SERVE</text>
  <rect x="160" y="318" width="200" height="30" class="tool" rx="8"/>
  <text x="174" y="338" class="sub" font-weight="700" fill="#1a1f24">Streamlit dashboard (5 tabs)</text>
  <rect x="380" y="318" width="230" height="30" class="box" rx="8"/>
  <text x="394" y="338" class="sub" fill="#1a1f24">GitHub Actions: daily run + 41 tests</text>
  <rect x="630" y="318" width="200" height="30" class="box" rx="8"/>
  <text x="644" y="338" class="sub" fill="#1a1f24">DuckDB warehouse artifact</text>

  <path class="ln" d="M 280 95 C 320 95 320 150 360 158"/>
  <path class="ln" d="M 280 185 L 355 178"/>
  <path class="ln" d="M 280 275 C 320 275 320 205 360 196"/>
  <path class="ln" d="M 530 160 C 570 160 570 100 610 100"/>
  <path class="ln" d="M 530 190 C 570 190 570 272 610 272"/>
  <path class="ln" d="M 810 100 C 825 100 818 160 830 172"/>
  <path class="ln" d="M 810 272 C 825 272 818 215 830 212"/>
</svg>
